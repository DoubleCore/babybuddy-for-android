def isExecutableOnPath = { String binaryName ->
    String pathEnv = System.getenv("PATH") ?: ""
    boolean isWin = System.getProperty("os.name").toLowerCase().contains("win")
    List<String> exts = isWin ? [".exe", ".cmd", ".bat", ""] : [""]
    for (String dir : pathEnv.split(java.util.regex.Pattern.quote(File.pathSeparator))) {
        if (dir.trim().isEmpty()) continue
        if (isWin && dir.toLowerCase().contains("windowsapps")) continue
        for (String ext : exts) {
            File candidate = new File(dir, binaryName + ext)
            if (candidate.exists() && candidate.isFile() && candidate.length() > 0) {
                return true
            }
        }
    }
    return false
}

tasks.register('generateAboutStrings') {
    doLast {
        String attributionsText = rootProject.file("ATTRIBUTIONS.md").getText("UTF-8")
        String[] sections = attributionsText.replaceAll("\r?\n", " ").split("##")

        def outList = []

        for (String sec in sections[1..-1]) {
            String title = sec.split("!\\[")[0]
            Matcher tagsMatch = title =~ /.*\(([^)]+)\).*/
            tagsMatch.find()
            String tagsList = tagsMatch.group(1).replaceAll(" ", "")

            Matcher addressMatch = sec =~ /(<a .*href.*>.*<\/a>)/
            addressMatch.find()
            String aHrefString = addressMatch.group(1)

            Matcher aHrefTitleMatch = aHrefString =~ /<a [^>]*>([^<]+)<\/a>/
            aHrefTitleMatch.find()
            String aHrefTitle = aHrefTitleMatch.group(1)

            Matcher aHrefAddressMatch = aHrefString =~ /<a[^>]+href="([^"]+)"[^>]*>/
            aHrefAddressMatch.find()
            String aHrefAddress = aHrefAddressMatch.group(1)

            outList.add(["icons": tagsList, "title": aHrefTitle, "link": aHrefAddress])
        }

        String licenseText = rootProject.file("LICENSE.md").getText("UTF-8").replace("\r\n", "\n").trim()
        String[] splits = licenseText.split("\n", 2)
        String licenseTitle = splits[0].replace("#", "").trim()
        licenseText = splits[1].trim().replaceAll("\n\n", "\\\\\\n\\\\\\n").replaceAll("\n", " ")

        def xmlout = new StringWriter()
        def xml = new MarkupBuilder(xmlout)
        xml.resources {
            xml."string-array"(name: "autostring_about_icon_iconlists", translatable: "false") {
                for (item in outList) {
                    xml.item(item["icons"])
                }
            }
            xml."string-array"(name: "autostring_about_icon_titles", translatable: "false") {
                for (item in outList) {
                    xml.item(item["title"])
                }
            }
            xml."string-array"(name: "autostring_about_icon_links", translatable: "false") {
                for (item in outList) {
                    xml.item(item["link"])
                }
            }
            xml.string(name: "autostring_about_license_title", translatable: "false", "Licensed under ${licenseTitle}")
            xml.string(name: "autostring_about_license_text", translatable: "false", licenseText)
        }

        File outAbout = project.file("src/main/res/values/about_strings.xml")
        outAbout.parentFile.mkdirs()
        outAbout.withWriter("UTF-8") { writer ->
            writer.write("<!-- Auto-generated file - do not edit! -->\n")
            writer.write(xmlout.getBuffer().toString())
        }
    }
}

tasks.register('invokeResourcesMakefile', Exec) {
    onlyIf { isExecutableOnPath("make") }
    commandLine 'make', '-C', '..', '-f', 'resources.makefile'
}

tasks.register('invokeHelpMakefile', Exec) {
    onlyIf { isExecutableOnPath("make") }
    commandLine 'make', '-C', '..', '-f', 'help.makefile'
}

tasks.register('generateHelpXmlPortable', Exec) {
    def isWin = System.getProperty("os.name").toLowerCase().contains("win")
    def candidates = isWin ? ["python", "py", "python3"] : ["python3", "python"]
    def pyBin = candidates.find { isExecutableOnPath(it) }
    onlyIf { !isExecutableOnPath("make") && pyBin != null }
    workingDir rootProject.projectDir
    if (pyBin != null) {
        commandLine pyBin, 'tools/generate_help_xml_portable.py'
    }
}

preBuild.dependsOn(generateAboutStrings)
preBuild.dependsOn(invokeResourcesMakefile)
preBuild.dependsOn(invokeHelpMakefile)
preBuild.dependsOn(generateHelpXmlPortable)

android {
    compileSdk = 37
    compileSdkMinor = 0

    defaultConfig {
        applicationId "eu.pkgsoftware.babybuddywidgets"
        minSdkVersion 29
        targetSdk 37
        versionCode 55
        versionName "3.0.0-standalone"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    signingConfigs {
        ciRelease {
            if (System.getenv('SIGNING_STORE_FILE')) {
                storeFile file(System.getenv('SIGNING_STORE_FILE'))
                storePassword System.getenv('SIGNING_STORE_PASSWORD')
                keyAlias System.getenv('SIGNING_KEY_ALIAS')
                keyPassword System.getenv('SIGNING_KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            if (System.getenv('SIGNING_STORE_FILE')) {
                signingConfig signingConfigs.ciRelease
            }
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
    buildFeatures {
        viewBinding true
    }
    testOptions {
        unitTests {
            includeAndroidResources = true
            returnDefaultValues = true
            all {
                if (project.hasProperty("skipIntegrationTests")) {
                    filter {
                        exclude '**/ClientV2IntegrationTest.class'
                    }
                }
            }
        }
    }
    namespace 'eu.pkgsoftware.babybuddywidgets'
    lint {
        abortOnError false
    }
}


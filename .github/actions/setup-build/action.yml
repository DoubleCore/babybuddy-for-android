name: Set up Android build
description: Shared build environment for CI and releases
runs:
  using: composite
  steps:
    - name: Install resource generation dependencies
      shell: bash
      run: |
        sudo apt-get update -o Acquire::Retries=2
        sudo apt-get install -y --no-install-recommends pandoc make gcc g++ imagemagick librsvg2-bin jq
    - uses: actions/setup-python@v5.1.0
      with:
        python-version: '3.12'
    - name: Install Python build dependencies
      shell: bash
      run: python -m pip install pipenv cython
    - uses: actions/setup-java@v4.5.0
      with:
        java-version: '21'
        distribution: temurin
    - uses: android-actions/setup-android@v4
      with:
        packages: platform-tools
    - name: Install Android platform and native toolchain
      shell: bash
      run: |
        sdkmanager --install 'platforms;android-37.0' 'build-tools;35.0.0' 'ndk;27.3.13750724' 'cmake;3.22.1' --channel=3
        if [[ ! -e "$ANDROID_HOME/platforms/android-37" ]]; then
          ln -s android-37.0 "$ANDROID_HOME/platforms/android-37"
        fi
    - uses: gradle/actions/setup-gradle@v6
    - name: Verify prerequisites
      shell: bash
      run: bash check-build-prerequisites.sh

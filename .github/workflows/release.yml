name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Existing version tag to build (e.g. v2.6.4); must match versionName'
        required: true
        type: string
      draft:
        description: Create a draft release
        type: boolean
        default: true
      prerelease:
        description: Mark as prerelease
        type: boolean
        default: false
      build_bundle:
        description: Also build AAB
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag_name || github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      sha: ${{ steps.version.outputs.sha }}
    steps:
      - uses: actions/checkout@v4.2.2
        with:
          ref: ${{ inputs.tag_name || github.ref }}
          submodules: recursive
          fetch-depth: 0
          persist-credentials: false
      - name: Validate tag and version
        id: version
        env:
          RELEASE_TAG: ${{ inputs.tag_name || github.ref_name }}
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]] || { echo '::error::Invalid release tag'; exit 1; }
          TAG_SHA=$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")
          [[ "$TAG_SHA" == "$(git rev-parse HEAD)" ]]
          VERSION=$(sed -nE 's/^[[:space:]]*versionName "([^"]+)".*/\1/p' app/build.gradle)
          [[ "${RELEASE_TAG#v}" == "$VERSION" ]] || { echo '::error::Tag must match app versionName'; exit 1; }
          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          echo "sha=$TAG_SHA" >> "$GITHUB_OUTPUT"
      - name: Restore production signing key
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_KEYSTORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD || secrets.SIGNING_KEYSTORE_PASSWORD }}
        run: |
          for name in SIGNING_KEYSTORE_BASE64 SIGNING_STORE_PASSWORD SIGNING_KEY_ALIAS SIGNING_KEY_PASSWORD; do
            [[ -n "${!name}" ]] || { echo "::error::Missing $name. Use CI checks for a test APK, or configure production signing secrets."; exit 1; }
          done
          umask 077
          printf '%s' "$SIGNING_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          keytool -list -keystore "$RUNNER_TEMP/release.jks" -storepass:env SIGNING_STORE_PASSWORD -alias "$SIGNING_KEY_ALIAS" > /dev/null
      - uses: ./.github/actions/setup-build
      - name: Build, test and verify release
        env:
          SIGNING_STORE_FILE: ${{ runner.temp }}/release.jks
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_KEYSTORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD || secrets.SIGNING_KEYSTORE_PASSWORD }}
          BUILD_BUNDLE: ${{ github.event_name == 'push' || inputs.build_bundle }}
        run: |
          tasks=(:app:assembleRelease :app:testDebugUnitTest :app:lintRelease)
          if [[ "$BUILD_BUNDLE" == true ]]; then tasks+=(:app:bundleRelease); fi
          ./gradlew --no-daemon --stacktrace "${tasks[@]}" -PskipIntegrationTests
          bash tools/workflows/check-translations.sh
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs app/build/outputs/apk/release/app-release.apk
      - name: Package artifacts
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          mkdir release-assets
          cp app/build/outputs/apk/release/app-release.apk "release-assets/babybuddy-for-android-$RELEASE_TAG.apk"
          if [[ -f app/build/outputs/bundle/release/app-release.aab ]]; then
            jarsigner -verify app/build/outputs/bundle/release/app-release.aab
            cp app/build/outputs/bundle/release/app-release.aab "release-assets/babybuddy-for-android-$RELEASE_TAG.aab"
          fi
          python3 tools/release/attributions-to-release.py > release-assets/RELEASE_NOTES.md
          (cd release-assets && sha256sum *.apk > SHA256SUMS.txt && if compgen -G '*.aab' > /dev/null; then sha256sum *.aab >> SHA256SUMS.txt; fi)
      - uses: actions/upload-artifact@v4
        with:
          name: release-assets
          path: release-assets/
          if-no-files-found: error
          retention-days: 30
      - name: Upload verification reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: release-reports
          path: app/build/reports/
      - name: Remove signing material
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"

  publish:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-assets
          path: release-assets
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.build.outputs.tag }}
          target_commitish: ${{ needs.build.outputs.sha }}
          name: Baby Buddy for Android ${{ needs.build.outputs.tag }}
          body_path: release-assets/RELEASE_NOTES.md
          draft: ${{ github.event_name == 'workflow_dispatch' && inputs.draft }}
          prerelease: ${{ inputs.prerelease || contains(needs.build.outputs.tag, '-') }}
          fail_on_unmatched_files: true
          overwrite_files: false
          files: |
            release-assets/*.apk
            release-assets/SHA256SUMS.txt
          generate_release_notes: true
      - name: Attach optional AAB
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.build.outputs.tag }}
        run: |
          if compgen -G 'release-assets/*.aab' > /dev/null; then
            gh release upload "$RELEASE_TAG" release-assets/*.aab
          fi

name: Release (Android + macOS)

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Version tag to build and release (e.g. v3.0.0-standalone)'
        required: true
        type: string
      draft:
        description: Create a draft release
        type: boolean
        default: false
      prerelease:
        description: Mark as prerelease
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.tag_name || github.ref_name }}
  cancel-in-progress: false

jobs:
  build-android:
    name: Build Android Release APK & AAB
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      sha: ${{ steps.version.outputs.sha }}
    steps:
      - uses: actions/checkout@v4.2.2
        with:
          ref: ${{ inputs.tag_name || github.ref }}
          submodules: recursive
          fetch-depth: 0
          persist-credentials: false
      - name: Resolve tag and commit
        id: version
        env:
          RELEASE_TAG: ${{ inputs.tag_name || github.ref_name }}
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]] || { echo '::error::Invalid release tag'; exit 1; }
          TAG_SHA=$(git rev-parse HEAD)
          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          echo "sha=$TAG_SHA" >> "$GITHUB_OUTPUT"
      - name: Prepare signing key (production secret or fallback test key)
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD || secrets.SIGNING_KEYSTORE_PASSWORD }}
        run: |
          if [[ -n "$SIGNING_KEYSTORE_BASE64" && -n "$SIGNING_STORE_PASSWORD" && -n "$SIGNING_KEY_ALIAS" ]]; then
            umask 077
            printf '%s' "$SIGNING_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
            echo "SIGNING_STORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "SIGNING_STORE_PASSWORD=$SIGNING_STORE_PASSWORD" >> "$GITHUB_ENV"
            echo "SIGNING_KEY_ALIAS=$SIGNING_KEY_ALIAS" >> "$GITHUB_ENV"
            echo "SIGNING_KEY_PASSWORD=$SIGNING_KEY_PASSWORD" >> "$GITHUB_ENV"
          else
            echo "No production signing secrets configured; generating test signing key."
            keytool -genkeypair -keystore "$RUNNER_TEMP/release.jks" -alias signing-smoke -keyalg RSA -keysize 2048 -validity 365 -storepass android -keypass android -dname 'CN=Baby Buddy Test Release'
            echo "SIGNING_STORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "SIGNING_STORE_PASSWORD=android" >> "$GITHUB_ENV"
            echo "SIGNING_KEY_ALIAS=signing-smoke" >> "$GITHUB_ENV"
            echo "SIGNING_KEY_PASSWORD=android" >> "$GITHUB_ENV"
          fi
      - uses: ./.github/actions/setup-build
      - name: Build Android APKs
        run: |
          ./gradlew --no-daemon --stacktrace :app:assembleDebug :app:assembleRelease :app:bundleRelease -PskipIntegrationTests
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose app/build/outputs/apk/release/app-release.apk
      - name: Package Android release assets
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          mkdir -p release-assets
          cp app/build/outputs/apk/release/app-release.apk "release-assets/babybuddy-android-$RELEASE_TAG.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "release-assets/babybuddy-android-debug-$RELEASE_TAG.apk"
          cp app/build/outputs/bundle/release/app-release.aab "release-assets/babybuddy-android-$RELEASE_TAG.aab"
      - uses: actions/upload-artifact@v4
        with:
          name: release-android-assets
          path: release-assets/
          if-no-files-found: error
          retention-days: 30
      - name: Remove signing material
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"

  build-mac:
    name: Build macOS Desktop App (.dmg / .zip)
    runs-on: macos-15-intel
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4.2.2
        with:
          ref: ${{ inputs.tag_name || github.ref }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies, generate icon and package macOS DMG/ZIP
        working-directory: mac-app
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: |
          npm install
          npm install --no-save @resvg/resvg-js
          mkdir -p build
          node -e "const fs=require('fs'),{Resvg}=require('@resvg/resvg-js');const svg=fs.readFileSync('../web/logo.svg','utf8');const png=new Resvg(svg,{fitTo:{mode:'width',value:1024}}).render().asPng();fs.writeFileSync('build/icon.png',png);"
          npm run build:mac
      - uses: actions/upload-artifact@v4
        with:
          name: release-mac-assets
          path: |
            mac-app/dist/*.dmg
            mac-app/dist/*.zip
          if-no-files-found: error
          retention-days: 30

  publish:
    needs: [build-android, build-mac]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: all-assets
      - name: Collect assets and checksums
        run: |
          mkdir -p dist-release
          find all-assets -type f \( -name '*.apk' -o -name '*.aab' -o -name '*.dmg' -o -name '*.zip' \) -exec cp {} dist-release/ \;
          (cd dist-release && sha256sum * > SHA256SUMS.txt)
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.build-android.outputs.tag }}
          target_commitish: ${{ needs.build-android.outputs.sha }}
          name: Baby Buddy ${{ needs.build-android.outputs.tag }} (Android & macOS)
          draft: ${{ github.event_name == 'workflow_dispatch' && inputs.draft }}
          prerelease: ${{ inputs.prerelease || contains(needs.build-android.outputs.tag, '-') }}
          fail_on_unmatched_files: true
          overwrite_files: true
          files: dist-release/*
          generate_release_notes: true

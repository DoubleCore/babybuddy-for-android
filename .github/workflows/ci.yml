name: Android APK Build

on:
  push:
    branches:
      - master
      - main
      - 'feat/**'
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout code and ZXing submodule
        uses: actions/checkout@v4.2.2
        with:
          submodules: recursive

      - name: Install Pandoc and other system requirements
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc make gcc g++ imagemagick jq cmake ninja-build

      - name: Set up Python
        uses: actions/setup-python@v5.1.0
        with:
          python-version: 3.12

      - name: Install python packages
        run: |
          python -m pip install --upgrade pip
          pip install pipenv
          pip install cython

      - name: Set up JDK 21
        uses: actions/setup-java@v4.5.0
        with:
          java-version: '21'
          distribution: temurin
      
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-37 ndk;27.3.13750724'

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v6

      - name: Check build prerequisites
        run: |
          bash check-build-prerequisites.sh

      - name: Build debug APK and run unit tests
        run: |
          ./gradlew --no-daemon --stacktrace :app:assembleDebug :app:testDebugUnitTest -PskipIntegrationTests

      - name: Run post-build checks
        run: |
          bash tools/workflows/check-translations.sh

      - name: Upload installable debug APK
        id: apk
        uses: actions/upload-artifact@v4
        with:
          name: babybuddy-debug-apk-${{ github.run_number }}
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Write build summary
        run: |
          echo '### Debug APK' >> "$GITHUB_STEP_SUMMARY"
          echo 'Build completed. The APK is signed with the Android debug key (not a production release).' >> "$GITHUB_STEP_SUMMARY"
          echo '[Download APK artifact](${{ steps.apk.outputs.artifact-url }})' >> "$GITHUB_STEP_SUMMARY"
          sha256sum app/build/outputs/apk/debug/*.apk >> "$GITHUB_STEP_SUMMARY"

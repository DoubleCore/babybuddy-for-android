name: CI checks

on:
  push:
    branches: [main, master, 'feat/**', 'ci/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build, unit tests and translations
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4.2.2
        with:
          submodules: recursive
          persist-credentials: false
      - uses: ./.github/actions/setup-build
      - name: Build debug APK, run unit tests and lint
        run: ./gradlew --no-daemon --stacktrace :app:assembleDebug :app:testDebugUnitTest :app:lintDebug -PskipIntegrationTests
      - name: Verify translations
        run: bash tools/workflows/check-translations.sh
      - name: Upload installable test APK
        id: apk
        uses: actions/upload-artifact@v4
        with:
          name: babybuddy-debug-${{ github.run_number }}
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30
      - name: Upload test and lint reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: reports-${{ github.run_number }}
          path: |
            app/build/reports/
            app/build/test-results/
          retention-days: 14
      - name: Write build summary
        env:
          ARTIFACT_URL: ${{ steps.apk.outputs.artifact-url }}
        run: |
          echo '### Build verified' >> "$GITHUB_STEP_SUMMARY"
          echo "[Download debug APK]($ARTIFACT_URL)" >> "$GITHUB_STEP_SUMMARY"
          echo 'Debug signing is for testing. Lint findings are reported; the existing Gradle lint policy is non-blocking.' >> "$GITHUB_STEP_SUMMARY"
          sha256sum app/build/outputs/apk/debug/*.apk >> "$GITHUB_STEP_SUMMARY"

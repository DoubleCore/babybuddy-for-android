name: CI & Multi-Platform Build

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-android:
    name: Build Android APK & Tests
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4.2.2
        with:
          submodules: recursive
          persist-credentials: false
      - uses: ./.github/actions/setup-build
      - name: Build debug APK, run unit tests and lint
        run: ./gradlew --no-daemon --stacktrace :app:assembleDebug :app:testDebugUnitTest :app:lintDebug -PskipIntegrationTests
      - name: Build test-signed release APK and bundle
        env:
          SIGNING_STORE_FILE: ${{ runner.temp }}/signing-smoke.jks
          SIGNING_STORE_PASSWORD: android
          SIGNING_KEY_ALIAS: signing-smoke
          SIGNING_KEY_PASSWORD: android
        run: |
          keytool -genkeypair -keystore "$SIGNING_STORE_FILE" -alias "$SIGNING_KEY_ALIAS" -keyalg RSA -keysize 2048 -validity 1 -storepass:env SIGNING_STORE_PASSWORD -keypass:env SIGNING_KEY_PASSWORD -dname 'CN=CI verification only'
          ./gradlew --no-daemon --stacktrace :app:assembleRelease :app:bundleRelease -PskipIntegrationTests
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose app/build/outputs/apk/release/app-release.apk
          jarsigner -verify app/build/outputs/bundle/release/app-release.aab
      - name: Verify translations
        run: bash tools/workflows/check-translations.sh
      - name: Upload Android Debug APK
        id: apk
        uses: actions/upload-artifact@v4
        with:
          name: babybuddy-android-debug-${{ github.run_number }}
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30
      - name: Upload Android Release APK (test-signed)
        uses: actions/upload-artifact@v4
        with:
          name: babybuddy-android-release-test-${{ github.run_number }}
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30
      - name: Upload test and lint reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: android-reports-${{ github.run_number }}
          path: |
            app/build/reports/
            app/build/test-results/
          retention-days: 14
      - name: Remove disposable signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/signing-smoke.jks"
      - name: Write Android build summary
        env:
          ARTIFACT_URL: ${{ steps.apk.outputs.artifact-url }}
        run: |
          echo '### Android Build Verified' >> "$GITHUB_STEP_SUMMARY"
          echo "[Download debug APK]($ARTIFACT_URL)" >> "$GITHUB_STEP_SUMMARY"
          sha256sum app/build/outputs/apk/debug/*.apk app/build/outputs/apk/release/*.apk >> "$GITHUB_STEP_SUMMARY"

  build-mac:
    name: Build macOS Desktop App (.dmg / .zip)
    runs-on: macos-15-intel
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies, generate icon and package macOS DMG/ZIP
        working-directory: mac-app
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: |
          npm install
          npm install --no-save @resvg/resvg-js
          mkdir -p build
          node -e "const fs=require('fs'),{Resvg}=require('@resvg/resvg-js');const svg=fs.readFileSync('../web/logo.svg','utf8');const png=new Resvg(svg,{fitTo:{mode:'width',value:1024}}).render().asPng();fs.writeFileSync('build/icon.png',png);"
          npm run build:mac
      - name: Upload macOS DMG & ZIP artifacts
        id: mac_pkg
        uses: actions/upload-artifact@v4
        with:
          name: babybuddy-macos-${{ github.run_number }}
          path: |
            mac-app/dist/*.dmg
            mac-app/dist/*.zip
          if-no-files-found: error
          retention-days: 30
      - name: Write macOS build summary
        env:
          ARTIFACT_URL: ${{ steps.mac_pkg.outputs.artifact-url }}
        run: |
          echo '### macOS Desktop Build Verified' >> "$GITHUB_STEP_SUMMARY"
          echo "[Download macOS DMG/ZIP]($ARTIFACT_URL)" >> "$GITHUB_STEP_SUMMARY"
          shasum -a 256 mac-app/dist/*.dmg mac-app/dist/*.zip >> "$GITHUB_STEP_SUMMARY"
